<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HEY, DIME</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{color-scheme:dark;--bg:#1a0b2e;--bg2:#2b1150;--pink:#ff3d8b;--gold:#ffd23f;--cyan:#3df5ff;--fg:#fff4fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 120%,var(--bg2),var(--bg) 60%)}
.stars{position:fixed;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 120px,var(--cyan),transparent),radial-gradient(2px 2px at 150px 60px,var(--gold),transparent),radial-gradient(2px 2px at 60px 170px,#fff,transparent);background-size:180px 200px;opacity:.55;animation:drift 18s linear infinite}
@keyframes drift{to{background-position:0 200px}}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);z-index:50}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:22px}
.screen.on{display:flex}
h1{margin:0;font-weight:400;line-height:1.5;font-size:clamp(20px,6.4vw,44px);color:var(--pink);text-shadow:4px 4px 0 #6a1138,0 0 24px rgba(255,61,139,.6)}
h1 em{font-style:normal;color:var(--gold);text-shadow:4px 4px 0 #6b5200,0 0 24px rgba(255,210,63,.5)}
.sub{margin:0;font-size:clamp(10px,2.8vw,14px);line-height:2;color:var(--cyan);max-width:30em}
.hero-heart{width:min(46vw,200px);image-rendering:pixelated;animation:beat 1.1s steps(2) infinite;filter:drop-shadow(0 0 18px rgba(255,61,139,.7))}
@keyframes beat{50%{transform:scale(1.12)}}
.btn{font:inherit;font-size:clamp(12px,3.4vw,16px);color:#1a0b2e;background:var(--gold);border:0;padding:18px 22px;cursor:pointer;box-shadow:0 6px 0 #a67f00,0 0 0 4px var(--fg);animation:blink 1s steps(2) infinite}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a67f00,0 0 0 4px var(--fg)}
.btn:focus-visible{outline:4px solid var(--cyan);outline-offset:6px}
@keyframes blink{50%{background:#fff0a3}}
#game{justify-content:flex-start;padding:0}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;font-size:clamp(9px,2.6vw,13px);line-height:1.8;z-index:5}
.hud b{font-weight:400;color:var(--gold)}
.bar{height:14px;width:min(40vw,180px);background:#000;border:3px solid var(--fg);margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .25s steps(6)}
.banner{position:absolute;top:30%;left:0;right:0;font-size:clamp(14px,4.6vw,28px);line-height:1.6;color:var(--gold);text-shadow:3px 3px 0 #6b5200;padding:0 16px;overflow-wrap:anywhere;opacity:0;pointer-events:none;z-index:6}
.banner.show{animation:pop 3.4s steps(17) forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}10%,80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.heart{position:absolute;top:-60px;width:52px;height:46px;padding:0;border:0;background:none;cursor:pointer;image-rendering:pixelated;animation:fall linear forwards;filter:drop-shadow(0 0 8px rgba(255,61,139,.8))}
.heart svg{width:100%;height:100%;display:block}
@keyframes fall{to{transform:translateY(calc(100vh + 120px))}}
.plus{position:absolute;color:var(--cyan);font-size:14px;pointer-events:none;animation:up .7s steps(7) forwards;z-index:7}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.lockbox{font-size:clamp(48px,14vw,80px);filter:drop-shadow(0 0 16px rgba(255,210,63,.7))}
.code{font:inherit;font-size:clamp(14px,4.4vw,20px);text-align:center;color:var(--gold);background:#000;border:4px solid var(--fg);padding:14px;width:min(78vw,300px);outline:none}
.code:focus{border-color:var(--cyan)}
.err{color:var(--pink);min-height:2.4em}
.shake{animation:shake .4s steps(8)}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@media (prefers-reduced-motion:reduce){.stars,.hero-heart,.btn{animation:none}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="scan"></div>

<section class="screen on" id="lock">
  <div class="lockbox" aria-hidden="true">🔒</div>
  <h1>LEVEL<br><em>LOCKED</em></h1>
  <p class="sub">ONLY PLAYER TWO HAS THE KEY.<br>WHEN DID SHE SPAWN?<br>TYPE THE DAY AND MONTH.</p>
  <input id="code" class="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="DD / MM" aria-label="Secret code">
  <button class="btn" id="unlock">UNLOCK</button>
  <p class="sub err" id="err" role="alert"></p>
</section>

<section class="screen" id="title">
  <svg class="hero-heart" id="bigHeart" viewBox="0 0 7 6" aria-hidden="true"></svg>
  <h1>HEY,<br><em>DIME</em></h1>
  <p class="sub">A WHOLE WORLD, MADE FOR YOU</p>
  <button class="btn" id="start">PRESS START</button>
</section>

<section class="screen" id="game" aria-label="Catch the hearts">
  <div class="hud">
    <div>MY WORLD<br>LEVEL <b id="lvl">1</b></div>
    <div style="text-align:right">LOVE <b id="score">0</b><div class="bar"><i id="fill"></i></div></div>
  </div>
  <div class="banner" id="banner"></div>
</section>

<section class="screen" id="win">
  <svg class="hero-heart" id="winHeart" viewBox="0 0 7 6" aria-hidden="true"></svg>
  <h1>YOU WIN<br><em>MY WORLD</em></h1>
  <p class="sub">I WANNA LOVE YOU MORE.<br>EVERY DAY. NEW LEVEL, SAME PLAYER TWO.</p>
  <button class="btn" id="again">PLAY AGAIN</button>
</section>

<script>
(function(){
  var M=["0110110","1111111","1111111","0111110","0011100","0001000"];
  function heartSVG(c){
    var s="";
    M.forEach(function(row,y){row.split("").forEach(function(v,x){if(v==="1")s+='<rect x="'+x+'" y="'+y+'" width="1.02" height="1.02" fill="'+c+'"/>';});});
    s+='<rect x="1" y="1" width="1" height="1" fill="#fff" opacity=".85"/>';
    return s;
  }
  document.getElementById("bigHeart").innerHTML=heartSVG("#ff3d8b");
  document.getElementById("winHeart").innerHTML=heartSVG("#ffd23f");

  var $=function(id){return document.getElementById(id)};
  var screens={lock:$("lock"),title:$("title"),game:$("game"),win:$("win")};
  function show(n){for(var k in screens)screens[k].classList.toggle("on",k===n);}

  var score=0,GOAL=20,timer=null;
  var msgs={6:"HERE IS YOUR DAILY DOSE OF THIS LLLLLLOOOOVVVVVEEEEEE",13:"YOU ARE MY WORLD",16:"I WANNA LOVE YOU MORE",18:"LEVEL UP!"};

  function banner(t,s){
    var b=$("banner");b.textContent=t;b.style.animationDuration=(s||3.4)+"s";b.classList.remove("show");void b.offsetWidth;b.classList.add("show");
  }
  function spawn(){
    var g=$("game"),h=document.createElement("button");
    var lvl=1+Math.floor(score/5);
    h.className="heart";h.setAttribute("aria-label","Catch the heart");
    h.innerHTML='<svg viewBox="0 0 7 6">'+heartSVG(["#ff3d8b","#ffd23f","#3df5ff"][Math.floor(Math.random()*3)])+'</svg>';
    h.style.left=(8+Math.random()*(g.clientWidth-76))+"px";
    h.style.animationDuration=Math.max(2.6,5.2-lvl*.5)+"s";
    h.addEventListener("pointerdown",function(e){
      e.preventDefault();
      var p=document.createElement("div");p.className="plus";p.textContent="+1";
      p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";g.appendChild(p);
      setTimeout(function(){p.remove()},700);
      h.remove();hit();
    });
    h.addEventListener("animationend",function(){h.remove()});
    g.appendChild(h);
  }
  function hit(){
    score++;
    $("score").textContent=score;
    $("lvl").textContent=1+Math.floor(score/5);
    $("fill").style.width=(score/GOAL*100)+"%";
    if(msgs[score])banner(msgs[score],score===6?7:3.4);
    if(score>=GOAL){clearInterval(timer);setTimeout(function(){
      document.querySelectorAll(".heart").forEach(function(x){x.remove()});show("win");
    },900);}
  }
  function begin(){
    score=0;$("score").textContent=0;$("lvl").textContent=1;$("fill").style.width="0";
    show("game");banner("MY WORLD");
    clearInterval(timer);spawn();
    timer=setInterval(spawn,650);
  }
  function hh(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
  var OK=["lvlh80ibq4","1o5nazxprd3"];
  function tryUnlock(){
    var v=$("code").value.toLowerCase().replace(/may/g,"5").replace(/\D/g,"").replace(/0/g,"");
    if(OK.indexOf(hh(v))>-1){show("title");return;}
    $("err").textContent="WRONG CODE. HINT: IT IS IN MAY.";
    var c=$("code");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
  }
  $("unlock").addEventListener("click",tryUnlock);
  $("code").addEventListener("keydown",function(e){if(e.key==="Enter")tryUnlock();});
  $("start").addEventListener("click",begin);
  $("again").addEventListener("click",begin);
})();
</script>
</body>
</html>
